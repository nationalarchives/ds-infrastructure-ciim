global:
  ciim:
    appName: tna

deployment:
  replicas: 1
  image:
    repository: public.ecr.aws/v3w7q3a1/tna-ciim
    tag: staging-0.2
  resources:
    requests:
      memory: 8Gi
    limits:
      memory: 8Gi
  javaOpts: >-
    -XX:InitialRAMPercentage=65 -XX:MaxRAMPercentage=65
    -XX:+PrintFlagsFinal
    -XX:+UseStringDeduplication
  envFrom:
    - secretRef:
        name: mongodb-staging-url
  podTemplateSpec:
    nodeSelector:
      kubernetes.io/hostname: ip-10-100-20-160.eu-west-2.compute.internal
encryptionKey:
  existingSecret:
    name: ciim-encryption-key
    key: ciim.encryption_key

storage:
  main:
    size: 50Gi

index:
  elasticsearch:
    version: 8.19.23
  storage:
    size: 30Gi

externalDatabase:
  host: ciim-db-service.etna
  schemas:
    main: etna-staging
    vault: etna-staging-vault
    archive: etna-staging-archive
  urlParams: autoReconnect=true&allowPublicKeyRetrieval=true&useSSL=false&useInformationSchema=false
  existingSecret:
    name: db-secret
    key: password

database:
  enabled: false

keycloak:
  enabled: false

management:
  enabled: false

ingress:
  enabled: false

kong:
  enabled: false

