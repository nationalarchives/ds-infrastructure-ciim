apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  strategy:
    type: Recreate
  progressDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      volumes:
        - name: clickhouse-data
          persistentVolumeClaim:
            claimName: clickhouse-pvc
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            - name: native
              containerPort: 9000
              protocol: TCP
          resources:
            requests:
              memory: 2Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
