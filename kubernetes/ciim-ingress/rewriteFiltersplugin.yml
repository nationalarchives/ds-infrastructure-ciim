apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: request-transform-filters
  namespace: etna
plugin: request-transformer
config:
  remove:
    querystring:
      - "filter"
      - "aggs"

  add:
add:
  querystring:
    - filter:$((function()
        if query_params["filter"] then
          if type(query_params["filter"]) == "table" then
            local grouped = {}
            local order = {}
            local i = 1
            while query_params["filter"][i] do
              local filter = query_params["filter"][i]
              local key, value = string.match(filter, "^([^:]+):(.+)$")
              if key and value then
                if not grouped[key] then
                  grouped[key] = {}
                  table.insert(order, key)
                end
                table.insert(grouped[key], value)
              end
              i = i + 1
            end
            local concatenatedValues = ""
            for _, key in ipairs(order) do
              local values = grouped[key]
              if 
                concatenatedValues = concatenatedValues .. key .. ":(" .. table.concat(values, ",") .. ");"
              else
                concatenatedValues = concatenatedValues .. key .. ":" .. values[1] .. ";"
              end
            end
            return concatenatedValues
          else
            return query_params["filter"]
          end
        end
      end)())
      - aggs:$((function()
          if query_params["aggs"] then
            if type(query_params["aggs"]) == "table" then
              local concatenatedValues = ""
              local i = 1
              while query_params["aggs"][i] do
                concatenatedValues = concatenatedValues .. query_params["aggs"][i] .. ","
                i = i + 1
              end
              return concatenatedValues
            else
              return query_params["aggs"]
            end
          end
        end)())
