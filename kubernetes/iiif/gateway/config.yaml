server:
  metrics_port: 9090

tenant:
  mode: static
  static: tna

access_tiers:
  viewer:
    prefix: /viewer/iiif/3/
    public_base_url: https://rosetta-staging.k-int.com/gateway/viewer/iiif/3
    max_width: 2000
    max_height: 2000
    redirect_ttl: 5m
  download:
    prefix: /download/iiif/3/
    public_base_url: https://rosetta-staging.k-int.com/gateway/download/iiif/3
    redirect_ttl: 10m

manifests:
  prefix: /iiif/3/manifest/
  redirect_ttl: 5m
  source:
    base_url: http://iiif-rosetta.staging.svc.cluster.local:4923/iiif/3/manifest/

identifier_resolver:
  type: filepath

buckets:
  jpg: ds-live-digital-files
  ptif: ds-staging-ptif-images
  cache: ds-staging-iiif-cache

derivative_generator:
  http:
     url: http://iiif-server-service:8080/render
  lambda:
    function_name: iiif-image-server

ptif_source:
  mode: convert
  converter:
    lambda:
      function_name: ptif-generator

memory_caches:
  ptifs:
    size: 100000
    ttl: 5m